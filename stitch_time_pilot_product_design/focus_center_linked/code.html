<button class="w-12 h-12 rounded-full bg-surface-container-low text-label-md text-on-surface-variant flex items-center justify-center shadow-[0_2px_8px_rgba(26,28,30,0.04)] hover:bg-surface-container transition-colors">45</button>
<button class="w-12 h-12 rounded-full bg-surface-container-low text-label-md text-on-surface-variant flex items-center justify-center shadow-[0_2px_8px_rgba(26,28,30,0.04)] hover:bg-surface-container transition-colors">60</button>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.getElementById('btn-start');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    const activeControls = document.getElementById('active-controls');
    
    const headerArea = document.getElementById('header-area');
    const timerArea = document.getElementById('timer-area');
    const quickOptions = document.getElementById('quick-options');
    const activeBgLayer = document.getElementById('active-bg-layer');
    const timeDisplay = document.getElementById('time-display');
    const timeDisplayContainer = document.getElementById('time-display-container');
    const sessionLabel = document.getElementById('session-label');
    const progressRing = document.getElementById('progress-ring-container');

    const modeButtons = document.querySelectorAll('[data-mode]');
    const modeSlider = document.getElementById('mode-slider');

    let isRunning = false;

    // Mode Switching Logic
    modeButtons.forEach((btn, index) => {
      btn.addEventListener('click', () => {
        if(isRunning) return; // Don't switch while running
        
        // Update slider position
        modeSlider.style.transform = `translateX(${index * 100}%)`;
        
        // Update button styles
        modeButtons.forEach(b => {
          b.classList.remove('text-on-surface', 'font-bold');
          b.classList.add('text-on-surface-variant');
        });
        btn.classList.add('text-on-surface', 'font-bold');
        btn.classList.remove('text-on-surface-variant');

        // Reset UI based on mode
        const mode = btn.dataset.mode;
        if(mode === 'countdown') {
          timeDisplay.innerText = '30:00';
          sessionLabel.innerText = 'Deep Work';
          quickOptions.style.display = 'flex';
          setTimeout(() => quickOptions.style.opacity = '1', 50);
          progressRing.style.opacity = '1';
        } else if(mode === 'stopwatch') {
          timeDisplay.innerText = '00:00';
          sessionLabel.innerText = 'Open Session';
          quickOptions.style.opacity = '0';
          setTimeout(() => quickOptions.style.display = 'none', 300);
          progressRing.style.opacity = '0';
        } else if(mode === 'pomodoro') {
          timeDisplay.innerText = '25:00';
          sessionLabel.innerText = 'Pomodoro • 1/4';
          quickOptions.style.display = 'flex';
          setTimeout(() => quickOptions.style.opacity = '1', 50);
          progressRing.style.opacity = '1';
        }
      });
    });

    // Start Focus Mode Transition
    startBtn.addEventListener('click', () => {
      isRunning = true;
      
      // Hide global nav (if accessible, simulating here)
      const nav = document.querySelector('nav');
      if(nav) nav.style.transform = 'translateY(100%)';
      const header = document.querySelector('header');
      if(header) header.style.transform = 'translateY(-100%)';

      // UI Transitions
      headerArea.style.opacity = '0';
      headerArea.style.transform = 'translateY(-20px)';
      headerArea.style.pointerEvents = 'none';

      quickOptions.style.opacity = '0';
      quickOptions.style.transform = 'translateY(20px)';
      quickOptions.style.pointerEvents = 'none';

      // Animate Buttons
      startBtn.style.transform = 'scale(0) translateY(40px)';
      startBtn.style.opacity = '0';
      startBtn.style.pointerEvents = 'none';
      
      activeControls.style.opacity = '1';
      activeControls.style.pointerEvents = 'auto';
      activeControls.style.transitionDelay = '200ms';

      // Center Timer Display
      timerArea.style.transform = 'translateY(0) scale(1.1)';
      timeDisplay.classList.remove('text-on-surface');
      timeDisplay.classList.add('text-on-primary-container');
      sessionLabel.classList.remove('text-on-surface-variant');
      sessionLabel.classList.add('text-primary-fixed-dim');

      // Bring in immersive background
      activeBgLayer.style.opacity = '1';
    });

    // Stop Focus Mode Transition
    stopBtn.addEventListener('click', () => {
      isRunning = false;
      
      // Show global nav
      const nav = document.querySelector('nav');
      if(nav) nav.style.transform = 'translateY(0)';
      const header = document.querySelector('header');
      if(header) header.style.transform = 'translateY(0)';

      // Restore UI
      headerArea.style.opacity = '1';
      headerArea.style.transform = 'translateY(0)';
      headerArea.style.pointerEvents = 'auto';

      quickOptions.style.opacity = '1';
      quickOptions.style.transform = 'translateY(0)';
      quickOptions.style.pointerEvents = 'auto';

      // Restore Buttons
      activeControls.style.opacity = '0';
      activeControls.style.pointerEvents = 'none';
      activeControls.style.transitionDelay = '0ms';

      startBtn.style.transform = 'scale(1) translateY(0)';
      startBtn.style.opacity = '1';
      startBtn.style.pointerEvents = 'auto';

      // Restore Timer Display
      timerArea.style.transform = 'translateY(0) scale(1)';
      timeDisplay.classList.add('text-on-surface');
      timeDisplay.classList.remove('text-on-primary-container');
      sessionLabel.classList.add('text-on-surface-variant');
      sessionLabel.classList.remove('text-primary-fixed-dim');

      // Remove immersive background
      activeBgLayer.style.opacity = '0';
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-16 px-unit"><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant transition-colors" data-path="dashboard" href="{{DATA:SCREEN:SCREEN_32}}"><span class="material-symbols-outlined">dashboard</span><span class="font-label-sm text-label-sm">Dashboard</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant transition-colors" data-path="plan" href="{{DATA:SCREEN:SCREEN_31}}"><span class="material-symbols-outlined">assignment</span><span class="font-label-sm text-label-sm">Plan</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-full transition-colors text-primary font-bold" data-path="focus" href="#"><span class="material-symbols-outlined">timer</span><span class="font-label-sm text-label-sm">Focus</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant transition-colors" data-path="ai-coach" href="{{DATA:SCREEN:SCREEN_22}}"><span class="material-symbols-outlined">auto_awesome</span><span class="font-label-sm text-label-sm">AI</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant transition-colors" data-path="review" href="{{DATA:SCREEN:SCREEN_24}}"><span class="material-symbols-outlined">bar_chart</span><span class="font-label-sm text-label-sm">Review</span></a></div></nav></body></html>
