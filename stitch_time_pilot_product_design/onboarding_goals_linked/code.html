<button class="bg-primary text-on-primary text-label-md px-8 py-3 rounded-full flex items-center gap-2 hover:bg-surface-tint hover:shadow-md transition-all opacity-50 cursor-not-allowed" disabled="" id="continue-btn" onclick="window.location.href='{{DATA:SCREEN:SCREEN_17}}'">
      Continue
      <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const options = document.querySelectorAll('.goal-option');
      const continueBtn = document.getElementById('continue-btn');
      
      function updateContinueButton() {
        const hasSelection = document.querySelectorAll('.goal-option.selected').length > 0;
        if (hasSelection) {
          continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          continueBtn.removeAttribute('disabled');
        } else {
          continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
          continueBtn.setAttribute('disabled', 'true');
        }
      }

      options.forEach(option => {
        option.addEventListener('click', function() {
          this.classList.toggle('selected');
          const isPressed = this.getAttribute('aria-pressed') === 'true';
          this.setAttribute('aria-pressed', !isPressed);
          
          // Subtle scale animation
          this.style.transform = 'scale(0.95)';
          setTimeout(() => {
            this.style.transform = 'scale(1)';
          }, 150);
          
          updateContinueButton();
        });
      });
    });
  </script>
